# Post season evaluation config
# Change `config_file_path` in {targets} script to the location of this file
# There are also duplicates of the file path in the {Targets} script, so take care to change these too

default:

  files:
    pipeline_path: "PATH REDACTED"
    pipeline_pattern: ".csv.gz"

  # the variables we need to extract from models
  required_covariates:
    - "date"
    - "nhs_region_name"
    - "age_group"
    - "prediction_start_date"
    - "model"
    - "population"
    - ".sample"
    - ".value"

  overall_params:
    disease: "rsv"
    target_name: "admissions" # "admissions" or "arrival_admissions"
    metric: "admissions" # "admissions" or "occupancy", based on folder
    # model_path: "full/path.R" # can set manually here, but generally not needed
    n_lookbacks: 23
    forecast_horizon: 14
    lookback_step_length: 7
    n_pi_sample: 500
    is_parallel: TRUE
    show_peaks: TRUE
    show_fits: FALSE
    threshold_type: "relative" # "absolute" an option; change values manually:
    threshold_rates:
      upper_rate: 0.2 # sugested relative range 20%
      lower_rate: -0.2

  # parameters passed to each model specifically
  #   order does not matter, but all models need: training_length
  models:

    gam_gp:
      include_run: false
      fit_thinning: 10
      training_length: 120
      age_group_alpha: 0.25

    gam_cr:
      include_run: false
      fit_thinning: 10
      training_length: 28
      age_group_q: 7

    gam_rw:
      include_run: false
      fit_thinning: 10
      training_length: 28
      alpha: 0.9

    # baseline model
    gam_dow:
      include_run: true
      fit_thinning: 10
      training_length: 14

  ensemble:
    gam_gp: false
    gam_cr: false
    gam_rw: false
    gam_dow: true

  target_workers: 6 # sets a mimimum number of parallel processes to assign
  # may be more on a bigger instances (any excess automatically dropped in 60s)

  # data quality considerations - which trust to remove
  # when excluding a trust, write a comment with the date and a brief justification
  exclude_trusts:
    - "RJE" # removed unrealisticly high tests across ages in wc 20/10/2024
    - "RJN" # removed unrealisticly high tests across some ages in wc 20/10/2024
