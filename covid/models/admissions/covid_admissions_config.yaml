# Configuration for covid admissions models

default:
  files:
    spatial_network_path: "PATH REDACTED"

  required_covariates:
    - "date"
    - "icb_name"
    - "nhs_region_name"
    - "prediction_start_date"
    - "model"
    - "population"
    - ".sample"
    - ".value"

  overall_params:
    target_name: "admissions" # "admissions"
    metric: "admissions" # "admissions" or "occupancy", based on folder
    #'' model_path: "full/path.R" # can set manually here but generally not needed
    n_lookbacks: 28 # ran on 11th april, using 1st october as an (approximate) season start date
    forecast_horizon: 14
    lookback_step_length: 7
    n_pi_sample: 500
    show_peaks: TRUE
    show_fits: FALSE
    threshold_type: "relative" # "absolute" is another option; change values below
    # comment out which models to run


  # parameters passed to each model specifically
  #   order does not matter, but all models need: training_length
  models:

    gam_cr:
      include_run: true
      fit_thinning: 10
      training_length: 105
      nation_q: 17

    gam_gp:
      include_run: true
      fit_thinning: 10
      training_length: 170
      nhs_region_name_q: 5
      icb_name_q: 20

    gam_rw:
      include_run: true
      fit_thinning: 10
      training_length: 56
      alpha: 0.762

    gr_gp:
      include_run: true
      fit_thinning: 10
      training_length: 100
      region_lengthscale: 0.22
      region_trend: false
      national_lengthscale: 0.241
      national_trend: true
      size: 166
      rolling_k: 7

    ets:
      include_run: true
      fit_thinning: 10
      training_length: 20
      alpha: 0.388
      beta: 0.0407
      phi: 0.888
      gamma: NULL
      nmse: 16

    gr_mean:
      include_run: true
      fit_thinning: 10
      training_length: 28
      size: 250
      rolling_k: 7

    epinow2_rw:
      include_run: true
      fit_thinning: 10
      training_length: 40
      n_warmup: 250
      generation_time__mean: 2.96
      generation_time__sd: 0.2
      incubation_period__mean: 3.81
      incubation_period__sd: 0.5
      onset_to_hospitalisation__mean: 7.5
      onset_to_hospitalisation__sd: 3
      ihr: 0.004
      initial_rt__mean: 1
      initial_rt__sd: 0.2
      susceptible_scale: 0.5


    # baseline model
    gam_dow:
      include_run: true
      fit_thinning: 10
      training_length: 14





    # define thresholds for classification of trend as a rate
  thresholds:
  # prior absolute value: 0.000001 i.e. 0.1 per 100k
  # Suggested relative value: 20% #
    admissions: 0.2

  target_workers: 8 # sets a mimimum number of parallel processes to assign
  # may be more on a bigger instances (any excess automatically dropped in 60s)
